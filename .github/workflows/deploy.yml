name: Deploy to Contabo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: contabo-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        shell: bash
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_USER: ${{ secrets.CONTABO_USER }}
          CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          CONTABO_PORT: ${{ secrets.CONTABO_PORT || '22' }}
        run: |
          set -euo pipefail
          : "${CONTABO_HOST:?Set the CONTABO_HOST secret}"
          : "${CONTABO_USER:?Set the CONTABO_USER secret}"
          : "${CONTABO_SSH_KEY:?Set the CONTABO_SSH_KEY secret}"

          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$CONTABO_SSH_KEY" | tr -d '\r' > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"

          ssh -T -i "$ssh_dir/key" -p "$CONTABO_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$CONTABO_USER@$CONTABO_HOST" 'bash -se' <<'DEPLOY'
          set -euo pipefail
          cd "$HOME/Pom"
          git pull --ff-only
          docker compose up -d --build app
          DEPLOY
